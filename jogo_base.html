<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de Síntese 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: mesa 3D ocupa a tela; tabela de apoio à direita; paleta e professor embaixo. */
:root{
  --bg:#0a1320; --panel:#12233a; --panel2:#1a3050; --panel3:#22395b; --deep:#0b1729; --line:#2b4a70; --line2:#3a5d88;
  --ink:#eaf1fa; --mute:#93a8c3; --accent:#ffb347; --accent2:#ffd08a; --accent-ink:#2a1a00; --ok:#5fd38d; --bad:#ff6b6b;
  --sh:0 24px 60px -18px #000d;
  --disp:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3a5d88 transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}
/* cabeçalho */
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#152a45,var(--panel));border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#ffc56b,#f0962a);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px -4px #ffb34799}
.logo svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
header h1{font-family:var(--disp);font-size:1.08rem;margin:0;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--mute)}
.hud{display:flex;align-items:center;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:600;white-space:nowrap}
.hud[hidden]{display:none}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.84rem;font-weight:600}
.hbtn:hover{border-color:var(--accent);color:var(--accent2)}
.hbtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#3a2c14}
@media(max-width:600px){header h1 small{display:none}.hbtn .tx{display:none}.hbtn{padding:8px 9px}}
@media(max-width:430px){header h1{display:none}}
main{position:relative;display:flex;min-height:0}
#view{position:relative;flex:1;min-width:0}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#req{position:absolute;left:10px;top:10px;background:#0a1320cc;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid #ffb34799;border-radius:14px;padding:9px 14px;max-width:min(320px,70%);box-shadow:0 10px 30px -12px #000c}
#req .t{font-size:.72rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#req .n{font-family:var(--disp);font-size:1.25rem;font-weight:800}
#req .f{font-family:var(--mono);font-size:.82rem;color:var(--accent);margin-top:2px;min-height:1.1em}
#cur{position:absolute;left:10px;bottom:10px;background:#0a1320dd;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--mono);font-size:.85rem;max-width:calc(100% - 20px);overflow-wrap:anywhere}
#side{width:340px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px;display:none}
#side.on{display:block}
@media(max-width:780px){#side{position:absolute;right:0;top:0;bottom:0;z-index:4;box-shadow:-8px 0 24px #000a}}
#side h3{display:flex;align-items:center;gap:8px;font-family:var(--disp);margin:12px 0 6px;font-size:.95rem}
#side h3::before{content:'';flex:none;width:4px;height:14px;border-radius:2px;background:var(--accent)}
.tb{width:100%;border-collapse:collapse;font-size:.74rem;margin:2px 0 6px}
.tb th{background:var(--panel2);text-align:left;padding:4px 6px;font-family:var(--disp)}
.tb td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tb td.m{font-family:var(--mono);color:var(--accent)}
.tb tr.hl td{background:#ffb34730;font-weight:600}
.tb tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.pf{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:.72rem;text-align:center}
.pf div{background:var(--panel2);border-radius:6px;padding:3px 0}.pf b{display:block;font-family:var(--mono);color:var(--accent)}
.note{background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:.78rem;margin:4px 0}
footer{background:linear-gradient(0deg,#0f1f35,var(--panel));border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
#tutor{display:flex;gap:10px;align-items:flex-start}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ffc56b,#f0962a);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:1.3rem;border:3px solid #ffd88a;box-shadow:0 0 0 4px #ffb3471f}
.vc{display:flex;gap:6px;align-self:center}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib[aria-pressed=false]{color:var(--bad);border-color:#ff6b6b66}
.av.talk{animation:talk .5s infinite alternate}
@keyframes talk{to{transform:scale(1.1)}}
#bub{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92rem;line-height:1.4;min-height:48px;max-height:96px;overflow:auto}
#bub.bad{border-color:var(--bad)}#bub.ok{border-color:var(--ok)}
/* barra de ferramentas: grupos com rótulo */
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.seg{display:flex;flex-direction:column;gap:4px}
.lab{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600;padding-left:2px}
.seg .row{display:flex;gap:3px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg.util{margin-left:auto}
.seg.util .row,.seg.ver .row{gap:6px;background:none;border:0;padding:3px 0}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 10px;font-family:var(--mono);font-weight:600;font-size:.88rem;min-width:42px;color:var(--ink)}
.tool:hover{background:var(--panel2)}
.tool[aria-pressed=true]{border-color:var(--accent);background:#3a2c14;color:var(--accent)}
.tool.ed{font-family:var(--body);font-size:.84rem}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset -2px -2px 3px #0007,inset 1px 1px 2px #fff6}
.dot.sm{width:9px;height:9px}
.act{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.84rem;font-weight:600}
.act:hover{border-color:var(--accent);color:var(--accent2)}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#ffc56b,#f5a13a);color:var(--accent-ink);border:0;font-family:var(--disp);font-weight:800;padding:9px 18px;border-radius:12px;box-shadow:0 6px 16px -6px #ffb347aa,inset 0 -2px 0 #0002}
.go:hover{filter:brightness(1.06)}
.go:active{transform:translateY(1px)}
.go svg.i{stroke-width:2.6}
@media(max-width:1020px){.act .tx{display:none}.act{padding:8px 10px}}
@media(max-width:560px){
  .lab{display:none}.tbar{gap:6px}.tool{padding:6px 8px}
  .seg.atoms{order:1}.seg.edit{order:2}.seg.groups{order:3}.seg.util{order:4}.seg.ver{order:5;flex:1 1 auto}.seg.ver .go{width:100%}
  .vc{flex-direction:column;gap:4px}.ib{width:36px;height:36px;border-radius:10px}
}

/* menus (fases e resultado) */
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:20;background:radial-gradient(120% 90% at 50% 0%,#0d1d33c4,#050b14f2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ov.on{display:flex}
.card{position:relative;background:linear-gradient(180deg,#16294a,#11213a);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--sh);max-width:780px;width:100%;max-height:100%;overflow:auto;padding:22px;animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
.card.sm{max-width:460px;text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center}
.x:hover{border-color:var(--accent);color:var(--accent)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:4px;align-items:center;margin:0 0 16px}
.x+.hero{padding-right:44px}
.hero .logo{grid-row:span 2;width:54px;height:54px;border-radius:16px}
.hero .logo svg{width:34px;height:34px}
.hero h2{align-self:end;font-family:var(--disp);font-size:1.65rem;font-weight:800;margin:0;line-height:1.05}
.hero p{align-self:start;margin:0;color:var(--mute);font-size:.9rem;line-height:1.4}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 18px}
.prog .meta{flex:1;min-width:200px}
.prog .nums{display:flex;gap:16px;font-size:.8rem;color:var(--mute);margin-bottom:7px}
.prog .nums b{color:var(--ink);font-family:var(--mono)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f0962a,#ffd08a)}
.prog .msg{font-size:.85rem;color:var(--ok);font-weight:600}
.sec{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin:0 0 9px;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;text-transform:none;letter-spacing:0;font-weight:500;font-size:.74rem}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--c)}
.legend span::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.lvl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 12px 12px;min-height:106px;transition:transform .15s,border-color .15s,background-color .15s;animation:pop .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*22ms)}
.lvl:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);background-color:var(--panel3)}
.lvl .top{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:20px}
.lvl .num{font-family:var(--mono);font-size:.75rem;color:var(--mute)}
.lvl .nm{font-family:var(--disp);font-weight:800;font-size:1rem;line-height:1.15}
.st{font-size:.85rem;letter-spacing:1px;color:var(--accent)}
.st .off{color:#ffffff2b}
.lvl.done{border-color:#5fd38d55}
.lvl.done .num{color:var(--ok)}
.lvl.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 26px -12px #ffb347aa}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
.tag svg.i{width:10px;height:10px;fill:currentColor;stroke:none}
.lvl:disabled{cursor:not-allowed;background:#15263f;border-style:dashed}
.lvl:disabled .nm,.lvl:disabled .chip{opacity:.45}
.lk{color:var(--mute)}
.lk svg.i{width:15px;height:15px}
.chip{display:inline-block;margin-top:auto;font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;color:var(--c);background:var(--cb);border:1px solid var(--cl)}
.k-hc{--c:#c3cddb;--cb:#c3cddb17;--cl:#c3cddb40}
.k-ox{--c:#ff8f85;--cb:#ff6b6b1c;--cl:#ff6b6b55}
.k-ni{--c:#8db0ff;--cb:#5b8cff1f;--cl:#5b8cff5c}
.k-cl{--c:#6fe0a0;--cb:#5fd38d1a;--cl:#5fd38d55}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.tip{display:flex;gap:9px;align-items:flex-start;font-size:.8rem;color:var(--mute);line-height:1.35;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.tip svg.i{color:var(--accent);margin-top:1px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);font-weight:700}
.card.sm h2{font-family:var(--disp);font-size:1.6rem;font-weight:800;margin:4px 0 4px}
.bigstars{display:flex;justify-content:center;gap:8px;margin:4px 0 14px}
.bigstars span{font-size:2.7rem;line-height:1;color:#ffffff1f;animation:star .55s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.2s + var(--d)*.16s)}
.bigstars span.on{color:var(--accent);text-shadow:0 0 18px #ffb34788}
@keyframes star{from{opacity:0;transform:scale(.3) rotate(-30deg)}}
.result{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.result .nm{font-family:var(--disp);font-weight:800;font-size:1.15rem}
.result .fm{font-family:var(--mono);color:var(--accent);font-size:1.05rem;margin:2px 0 8px;overflow-wrap:anywhere}
.exp{color:var(--mute);font-size:.88rem;line-height:1.45;margin:0 0 12px}
.tipline{font-size:.78rem;color:var(--accent2);background:#ffb34712;border:1px dashed #ffb34755;border-radius:10px;padding:7px 10px;margin:0 0 14px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.88rem}
.ghost:hover{border-color:var(--accent);color:var(--accent2)}
@media(max-width:560px){.card{padding:18px 16px;border-radius:18px}.hero{column-gap:12px}.hero .logo{grid-row:auto;width:42px;height:42px;border-radius:12px}.hero .logo svg{width:26px;height:26px}.hero h2{align-self:center;font-size:1.25rem}.x+.hero{padding-right:0}.x+.hero h2{margin-right:44px}.hero p{grid-column:1/-1;margin-top:8px}.lv{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.lvl{min-height:98px;padding:10px}}
.stars{color:var(--accent);letter-spacing:2px}
.mute{color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3"/><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M10.5 9.1 7.5 14.4M13.5 9.1l3 5.3M9 17h6"/></svg></div>
      <h1>Mesa de Síntese 3D<small>Química orgânica com o Prof. Carbono</small></h1>
    </div>
    <div class="hud" id="hud" hidden><span id="pl">Fase 1</span><span class="stars" id="ps"></span></div>
    <button class="hbtn" id="bt" aria-pressed="false" title="Tabela de apoio"><svg class="i" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span class="tx">Tabela</span></button>
    <button class="hbtn" id="bm" title="Escolher fase"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="tx">Fases</span></button>
  </header>
  <main>
    <div id="view">
      <div id="req"><div class="t">Pedido</div><div class="n" id="rn"></div><div class="t" id="rf"></div><div class="f" id="rfo"></div></div>
      <div id="cur"></div>
    </div>
    <aside id="side"></aside>
  </main>
  <footer>
    <div id="tutor">
      <div class="av" id="av">C</div>
      <div id="bub">Carregando o laboratório...</div>
      <div class="vc">
        <button class="ib" id="br" title="Repetir a fala" aria-label="Repetir a fala"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="ib" id="bs" aria-pressed="true"></button>
      </div>
    </div>
    <div class="tbar" id="tbar">
      <div class="seg atoms"><span class="lab">Átomos</span><div class="row">
        <button class="tool" data-t="C" aria-pressed="true" title="Carbono: faz 4 ligações"><i class="dot" style="--c:#8a919c"></i>C</button>
        <button class="tool" data-t="O" aria-pressed="false" title="Oxigênio: faz 2 ligações"><i class="dot" style="--c:#e8423c"></i>O</button>
        <button class="tool" data-t="N" aria-pressed="false" title="Nitrogênio: faz 3 ligações"><i class="dot" style="--c:#3b6fe8"></i>N</button>
      </div></div>
      <div class="seg groups"><span class="lab">Grupos</span><div class="row">
        <button class="tool" data-t="OH" aria-pressed="false" title="Hidroxila (clique em um átomo)"><i class="dot sm" style="--c:#e8423c"></i>–OH</button>
        <button class="tool" data-t="=O" aria-pressed="false" title="Carbonila, dupla com O (clique em um átomo)"><i class="dot sm" style="--c:#e8423c"></i>=O</button>
        <button class="tool" data-t="NH2" aria-pressed="false" title="Grupo amino (clique em um átomo)"><i class="dot sm" style="--c:#3b6fe8"></i>–NH₂</button>
        <button class="tool" data-t="Cl" aria-pressed="false" title="Cloro (clique em um átomo)"><i class="dot sm" style="--c:#3ddc6a"></i>–Cl</button>
      </div></div>
      <div class="seg edit"><span class="lab">Editar</span><div class="row">
        <button class="tool ed" data-t="bond" aria-pressed="false" title="Clique no traço entre dois átomos: simples, dupla, tripla"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 10.2h9M7.5 13.8h9"/></svg>Ligação</button>
        <button class="tool ed" data-t="del" aria-pressed="false" title="Clique em um átomo ou grupo para apagar"><svg class="i" viewBox="0 0 24 24"><path d="M20 20H9l-5-5a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8L11 19"/><path d="M8.5 10.5l6 6"/></svg>Apagar</button>
      </div></div>
      <div class="seg util"><span class="lab">&nbsp;</span><div class="row">
        <button class="act" id="bh" title="Dica" aria-label="Dica"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span class="tx">Dica</span></button>
        <button class="act" id="bc" title="Limpar a mesa" aria-label="Limpar a mesa"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="tx">Limpar</span></button>
      </div></div>
      <div class="seg ver"><span class="lab">&nbsp;</span><div class="row">

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
/* ===================== QUÍMICA ===================== */
const EL={C:{v:4,col:0x434a55,r:.42,n:'carbono'},O:{v:2,col:0xe8423c,r:.38,n:'oxigênio'},N:{v:3,col:0x3b6fe8,r:.38,n:'nitrogênio'},H:{v:1,col:0xf4f6f9,r:.24},Cl:{v:1,col:0x3ddc6a,r:.46}};
const SUBS={'OH':{cost:1,el:'O',h:1,label:'OH'},'=O':{cost:2,el:'O',h:0,label:'=O'},'NH2':{cost:1,el:'N',h:2,label:'NH₂'},'Cl':{cost:1,el:'Cl',h:0,label:'Cl'},'≡N':{cost:3,el:'N',h:0,label:'≡N'}};
const MAXA=5;
const sub=n=>String(n).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
const cost=a=>a.subs.reduce((s,x)=>s+SUBS[x].cost,0);
function usedOf(S,i){let u=cost(S.atoms[i]);if(i>0)u+=S.bonds[i-1];if(i<S.atoms.length-1)u+=S.bonds[i];return u}
function freeOf(S,i){return EL[S.atoms[i].el].v-usedOf(S,i)}
function clone(S){return{atoms:S.atoms.map(a=>({el:a.el,subs:a.subs.slice()})),bonds:S.bonds.slice()}}
/* terminais O/N viram grupos: C–O = –OH, C=O, C–N = –NH2, C≡N */
function norm(S){
  const R=clone(S);let ch=true;
  while(ch&&R.atoms.length>=2){
    ch=false;
    for(const end of ['last','first']){
      const i=end==='last'?R.atoms.length-1:0,a=R.atoms[i];
      if(R.atoms.length<2||(a.el!=='O'&&a.el!=='N')||a.subs.length)continue;
      const bi=end==='last'?R.bonds[R.bonds.length-1]:R.bonds[0],j=end==='last'?i-1:i+1;
      let g=null;
      if(a.el==='O')g=bi===1?'OH':bi===2?'=O':null;
      else g=bi===1?'NH2':bi===3?'≡N':null;
      if(!g)continue;
      R.atoms[j].subs.push(g);
      if(end==='last'){R.atoms.pop();R.bonds.pop()}else{R.atoms.shift();R.bonds.shift()}
      ch=true;break;
    }
  }
  return R;
}
const ORD=['=O','OH','NH2','Cl','≡N'];
function fmt(S){
  const n=S.atoms.length,out=[];
  for(let i=0;i<n;i++){
    const a=S.atoms[i],term=(i===0||i===n-1),subs=a.subs.slice().sort((x,y)=>ORD.indexOf(x)-ORD.indexOf(y));
    const h=EL[a.el].v-usedOf(S,i);let t='';
    if(a.el==='C'){
      if(subs.includes('=O')){
        if(subs.includes('OH'))t='COOH';else if(subs.includes('NH2'))t='CONH₂';else if(term&&h>0)t='CHO';else t='CO';
      }else if(subs.includes('≡N'))t='C≡N';
      else{
        t='C'+(h>0?'H'+(h>1?sub(h):''):'');
        if(subs.length){const l=subs.map(s=>SUBS[s].label);t+=(term&&l.length===1)?'–'+l[0]:l.map(x=>'('+x+')').join('')}
      }
    }else if(a.el==='O')t='O';
    else if(a.el==='N')t='N'+(h>0?'H'+(h>1?sub(h):''):'');
    out.push(t);
    if(i<n-1)out.push(['','–','=','≡'][S.bonds[i]]);
  }
  return out.join('');
}
function canon(S){
  const N=norm(S);
  const rev={atoms:N.atoms.slice().reverse(),bonds:N.bonds.slice().reverse()};
  const a=fmt(N),b=fmt(rev);return a<b?a:b;
}
const FN={alcano:'alcano',alceno:'alceno',alcino:'alcino',alcool:'álcool',aldeido:'aldeído',cetona:'cetona',acido:'ácido carboxílico',ester:'éster',eter:'éter',amina:'amina',amida:'amida',nitrila:'nitrila',haleto:'haleto orgânico'};

const FVOZ={

 eter:'Um éter tem um oxigênio ligado a dois carbonos, sem hidrogênio no oxigênio.',
 amina:'Uma amina tem nitrogênio ligado a carbono, sem carbonila.',
 amida:'Uma amida tem a carbonila ligada a um nitrogênio.',

 haleto:'Um haleto orgânico tem um halogênio, como o cloro, ligado a carbono.'
};
const PRI=['acido','ester','amida','nitrila','aldeido','cetona','alcool','amina','eter','haleto','alcino','alceno'];
function detect(S0){
  const S=norm(S0),n=S.atoms.length,set=new Set();
  const hasCO=j=>S.atoms[j].subs.includes('=O');
  for(let i=0;i<n;i++){
    const a=S.atoms[i],nb=[];if(i>0)nb.push(i-1);if(i<n-1)nb.push(i+1);
    if(a.el==='C'){
      const co=a.subs.includes('=O');
      if(co){
        const nN=nb.some(j=>S.atoms[j].el==='N'),nO=nb.some(j=>S.atoms[j].el==='O');
        if(a.subs.includes('OH'))set.add('acido');
        else if(a.subs.includes('NH2')||nN)set.add('amida');
        else if(nO)set.add('ester');
        else if(nb.length<=1)set.add('aldeido');
        else set.add('cetona');
      }else{
        if(a.subs.includes('≡N'))set.add('nitrila');
        if(a.subs.includes('OH'))set.add('alcool');
        if(a.subs.includes('NH2'))set.add('amina');
        if(a.subs.includes('Cl'))set.add('haleto');
      }
    }else if(a.el==='O'&&nb.length===2){
      if(!nb.some(hasCO))set.add('eter');
    }else if(a.el==='N'&&nb.length===2){
      if(!nb.some(hasCO))set.add('amina');
    }
    if(i<n-1&&a.el==='C'&&S.atoms[i+1].el==='C'){if(S.bonds[i]===2)set.add('alceno');if(S.bonds[i]===3)set.add('alcino')}
  }
  for(const k of PRI)if(set.has(k))return k;
  return 'alcano';
}
const carbons=S=>norm(S).atoms.filter(a=>a.el==='C').length;
function overflow(S){const r=[];S.atoms.forEach((a,i)=>{if(usedOf(S,i)>EL[a.el].v)r.push(i)});return r}

}

const AUD=/*AUDIO_JSON*/{}/*END_AUDIO*/;
const MISS=new Set();
let voiceOn=true,lastParts=[],voice=null,lastWarn=0,playId=0,curAudio=null;
function pickVoice(){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang));voice=vs.find(v=>/natural|neural|online/i.test(v.name))||vs.find(v=>/pt[-_]BR/i.test(v.lang))||vs[0]||null}catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function stopVoice(){playId++;try{speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}$('av').classList.remove('talk')}
function ttsOne(s,cb){try{const u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.rate=.96;if(voice)u.voice=voice;u.onend=u.onerror=()=>cb();speechSynthesis.speak(u)}catch(e){cb()}}
function playParts(parts){
  if(!voiceOn||!parts||!parts.length)return;
  stopVoice();const id=playId;let i=0;$('av').classList.add('talk');
  const next=()=>{
    if(id!==playId)return;
    if(i>=parts.length){$('av').classList.remove('talk');return}
    const s=nsent(parts[i++]),b=AUD[s];
    if(b){
      const a=new Audio('data:audio/mpeg;base64,'+b);curAudio=a;
      a.onended=()=>setTimeout(next,120);a.onerror=()=>ttsOne(s,next);
      const p=a.play();if(p&&p.catch)p.catch(()=>ttsOne(s,next));
    }else{MISS.add(s);ttsOne(s,next)}
  };
  next();
}
function say(voz,text,cls){
  const parts=Array.isArray(voz)?voz:sents(voz);
  lastParts=parts;
  const b=$('bub');b.textContent=text||parts.join(' ');b.className=cls||'';
  playParts(parts);
}

function check(){
  if(done)return;
  const T=LV[li];
  if(!M.atoms.length){say(V.empty(),'Mesa vazia: coloque o primeiro carbono.','bad');return}
  const ov=overflow(M);
  if(ov.length){
    const i=ov[0],a=M.atoms[i];wrong++;
    say(V.valence(a.el,i+1),`Erro de valência no átomo ${i+1} (${a.el}). C faz 4, N faz 3, O faz 2, H e Cl fazem 1.`,'bad');return;
  }
  const N=norm(M),c=canon(M);
  if(c===T.canon){win();return}
  wrong++;
  const built=detect(M),bc=carbons(M),tc=T.nc,myF=fmt(N);
  let parts,txt;
  if(bc!==tc){
    const dif=Math.abs(bc-tc);
    parts=V.carbons(li,bc);
    txt=`Você montou ${myF}. O prefixo "${PFXN[tc]}" pede ${tc} C, e você tem ${bc}. ${bc<tc?'Faltam':'Sobram'} ${dif}. ${T.how}`;
  }else if(built!==T.fn){
    parts=V.fn(built,li);
    txt=`Você montou ${myF}, que é um ${FN[built]}. O pedido é ${FN[T.fn]}. ${T.how}`;
  }else{
    const tn=norm(T.S);
    let k=-1;tn.atoms.forEach((a,i)=>{if(k<0&&(a.subs.length||a.el!=='C'))k=Math.min(i,tn.atoms.length-1-i)+1});
    const bondsDiff=JSON.stringify(N.bonds)!==JSON.stringify(tn.bonds)&&JSON.stringify(N.bonds)!==JSON.stringify(tn.bonds.slice().reverse());
    if(bondsDiff){parts=V.bond();txt='Função certa, mas as ligações não batem. Confira o infixo (an, en, in).'}
    else{parts=V.pos(built,k>0?Math.min(k,3):1);txt=`Função certa, posição errada. No pedido, o grupo fica no carbono ${k>0?k:'indicado no nome'}.`}
  }
  say(parts,txt,'bad');beep(140,.25,'sawtooth');
  $('ps').textContent=starStr(Math.max(1,3-wrong-(revealed?1:0)));
}
function win(){

  say(V.win(li),`Correto! ${T.n}: ${fmt(norm(M))}. ${T.ok}`,'ok');
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*120));

    SITES.forEach(s=>sites.push(s));
    const items=a.subs.map((g,j)=>({g,j}));
    const free=Math.max(0,EL[a.el].v-usedOf(M,i));
    for(let k=0;k<free;k++)items.push({g:'H'});
    items.forEach((it,k)=>{
      const d=sites[k%sites.length].clone().normalize(),L=it.g==='H'?.95:1.1,q=p.clone().addScaledVector(d,L);
      if(it.g==='H'){
        mol.add(bondGroup(p,q,1,.045));addSphere('H',q,'h',null);
      }else{
        const S=SUBS[it.g];
        mol.add(bondGroup(p,q,S.cost>=3?3:S.cost,.06));
        const so=addSphere(S.el,q,'s'+i+'_'+it.j,{type:'sub',i,j:it.j});
        if(S.el!=='Cl'||true){const lb=label(S.el);lb.position.copy(q);lb.scale.set(.5,.5,1);mol.add(lb)}
        const angs=S.h===1?[.7]:S.h===2?[.55,-.55]:[];
        angs.forEach(an=>{
          const dd=d.clone().applyAxisAngle(new THREE.Vector3(0,0,1),an*(d.x>=0?1:-1)*(Math.abs(d.y)>.5?1:1));
          const hq=q.clone().addScaledVector(dd,.8);
          mol.add(bondGroup(q,hq,1,.04));addSphere('H',hq,'h',null);
        });
      }
    });
  }
  if(n<MAXA){
    const mk2=new THREE.Mesh(new THREE.TorusGeometry(.5,.05,10,32),new THREE.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:.8}));
    mk2.position.set(SLOTX(n),Y0,0);mk2.userData={type:'slot'};mol.add(mk2);pickables.push(mk2);marker=mk2;
    const disc=new THREE.Mesh(new THREE.CircleGeometry(.5,24),new THREE.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:.12,side:THREE.DoubleSide}));disc.position.copy(mk2.position);disc.userData={type:'slot'};mol.add(disc);pickables.push(disc);
  }
  fresh.clear();
}
/* confete */
let conf=[];
function confetti(){
  for(let i=0;i<90;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.04),new THREE.MeshBasicMaterial({color:[0xffb347,0x5fd38d,0x4aa3ff,0xff7ac8][i%4]}));
    m.position.set((Math.random()-.5)*4,2.2,(Math.random()-.5)*2);m.userData={v:new THREE.Vector3((Math.random()-.5)*.12,.08+Math.random()*.1,(Math.random()-.5)*.08),l:140};scene.add(m);conf.push(m);
  }
}
/* picking */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(pickables,false);
  return h.length?h[0].object.userData:null;
}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||done)return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
  if(moved>6)return;
  onClick(pick(e));
});
function onClick(u){
  if(!u)return;
  const t=tool;
  if(t==='C'||t==='O'||t==='N'){
    if(u.type==='atom')setEl(u.i,t);
    else if(u.type==='slot'||u.type==='table')addAtom(t);
  }else if(SUBS[t]){
    if(u.type==='atom')addSub(u.i,t);
    else $('bub').textContent='Para colocar um grupo, clique em um átomo da cadeia.';
  }else if(t==='bond'){
    if(u.type==='bond')cycleBond(u.i);
    else $('bub').textContent='Clique no traço entre dois átomos para mudar a ligação (simples, dupla, tripla).';
  }else if(t==='del'){
    if(u.type==='atom')removeAtom(u.i);
    else if(u.type==='sub')removeSub(u.i,u.j);
    else if(u.type==='bond'){M.bonds[u.i]=1;changed()}
  }
  beep(520,.06,'triangle',.04);
}
/* tamanho e loop */
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);
  const m=w/h<1.1?'p':'l';
  if(m!==vmode){vmode=m;SP=m==='p'?1.15:1.7;camera.fov=m==='p'?60:45;const d=m==='p'?10.2:8.8;camera.position.set(0,d*.375,d*.927);controls.update();try{rebuild()}catch(e){}}
camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view);window.addEventListener('resize',resize);
const ease=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  animObjs.forEach(m=>{const t=Math.min(1,(now-m.userData.born)/350);m.scale.setScalar(m.userData.base*(m.userData.born>0?Math.max(.01,ease(t)):1))});
  if(marker){const s=1+.08*Math.sin(now*.005);marker.scale.set(s,s,1)}
  conf.forEach(m=>{m.position.add(m.userData.v);m.userData.v.y-=.0035;m.rotation.x+=.1;m.rotation.y+=.07;m.userData.l--;if(m.userData.l<=0){scene.remove(m)}});
  conf=conf.filter(m=>m.userData.l>0);
  controls.update();renderer.render(scene,camera);
}

/* ===================== EVENTOS DA INTERFACE ===================== */
$('tbar').addEventListener('click',e=>{
  const b=e.target.closest('.tool');if(!b)return;
  tool=b.dataset.t;document.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
$('bv').onclick=check;$('bh').onclick=hint;$('br').onclick=()=>{playParts(lastParts)};
function setVoiceBtn(){
  const b=$('bs'),t=voiceOn?'Voz ligada (clique para desligar)':'Voz desligada (clique para ligar)';
  b.setAttribute('aria-pressed',voiceOn);b.innerHTML=voiceOn?IC.vol:IC.mute;b.title=t;b.setAttribute('aria-label',t);
}
const syncSide=()=>$('bt').setAttribute('aria-pressed',$('side').classList.contains('on'));
$('bs').onclick=()=>{voiceOn=!voiceOn;setVoiceBtn();if(!voiceOn)stopVoice();else playParts(lastParts)};
$('bc').onclick=()=>{if(!done)clearTable()};
$('bt').onclick=()=>{$('side').classList.toggle('on');syncSide()};
$('bm').onclick=menu;
$('card').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lv!==undefined)startLevel(+b.dataset.lv);
  else if(b.dataset.a==='next')startLevel(li+1);
  else if(b.dataset.a==='again')startLevel(li);
  else if(b.dataset.a==='menu')menu();
  else if(b.dataset.a==='close')$('ov').classList.remove('on');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&started&&$('ov').classList.contains('on')&&$('card').classList.contains('menu'))$('ov').classList.remove('on');
});
window.__game={V,AUD,MISS,get lastParts(){return lastParts},get M(){return M},startLevel,check,addAtom,addSub,cycleBond,setEl,say,get li(){return li},LV,canon,fmt,norm,detect};

resize();loop();
$('side').classList.toggle('on',window.innerWidth>780);
syncSide();setVoiceBtn();
renderSide();menu();
$('bub').textContent='Escolha uma fase para começar. O professor vai explicar tudo por voz.';
</script>
